[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-manimgl"
version = "0.1.1"
description = "MCP server exposing manimgl (Manim OpenGL) mathematical animation functionality as tools for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Darío Clavijo", email = "clavijodario@gmail.com"}
]
dependencies = [
    "fastmcp>=3.3",
]

[project.optional-dependencies]
render = ["manimgl>=1.7.2"]
audio = ["gtts>=2.5.4", "pyfluidsynth>=1.3.4"]
dev = [
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "hatch>=1.16.5",
    "pip-api>=0.0.34",
    "impactguard>=0.1.6",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "hypothesis>=6.152.7",
]
lint = [
    "prospector[with_ruff,with_mypy]>=1.18.0",
    "semgrep>=1.163.0",
    "vulture>=2.16",
]
mcp = ["fastmcp>=3.3"]
all = ["mcp-manimgl[dev,test,lint,mcp]"]

[project.scripts]
mcp-manimgl = "mcp_manimgl.__main__:main"

[project.urls]
Homepage = "https://github.com/dclavijo/mcp-manimgl"
Repository = "https://github.com/dclavijo/mcp-manimgl"
Issues = "https://github.com/dclavijo/mcp-manimgl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_manimgl"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_manimgl"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "TCH", "N", "C4", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.prospector]
output-format = "text"
strictness = "medium"
test-warnings = false

[tool.prospector.tools]
ruff = true
mypy = true
pylint = true
pyflakes = false
pycodestyle = false
mccabe = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-fail-under=70"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude = ["tests/*", "*/__init__.py"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
